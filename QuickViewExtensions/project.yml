name: QuickViewExtensions
options:
  bundleIdPrefix: com.albertopasca
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ETE2S82AG6

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"

schemes:
  QuickViewExtensions:
    build:
      targets:
        QuickViewExtensions: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  QuickViewExtensions:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions
        PRODUCT_NAME: QuickViewExtensions
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/QuickViewExtensions.entitlements
        ENABLE_APP_SANDBOX: true
    dependencies:
      - target: easyMDView
        embed: true
      - target: easyJSONView
        embed: true
      - target: easyCodeView
        embed: true
      - target: easyYAMLView
        embed: true
      - target: easyDotEnvView
        embed: true
      - target: easyLogView
        embed: true
      - target: easySQLView
        embed: true

  easyMDView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyMDView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyMDView
        PRODUCT_NAME: easyMDView
        INFOPLIST_FILE: Extensions/easyMDView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyMDView/easyMDView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: swift-markdown
        product: Markdown

  easyJSONView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyJSONView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyJSONView
        PRODUCT_NAME: easyJSONView
        INFOPLIST_FILE: Extensions/easyJSONView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyJSONView/easyJSONView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"

  easyCodeView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyCodeView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyCodeView
        PRODUCT_NAME: easyCodeView
        INFOPLIST_FILE: Extensions/easyCodeView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyCodeView/easyCodeView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"

  easyYAMLView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyYAMLView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyYAMLView
        PRODUCT_NAME: easyYAMLView
        INFOPLIST_FILE: Extensions/easyYAMLView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyYAMLView/easyYAMLView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"

  easyDotEnvView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyDotEnvView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyDotEnvView
        PRODUCT_NAME: easyDotEnvView
        INFOPLIST_FILE: Extensions/easyDotEnvView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyDotEnvView/easyDotEnvView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"

  easyLogView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easyLogView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easyLogView
        PRODUCT_NAME: easyLogView
        INFOPLIST_FILE: Extensions/easyLogView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easyLogView/easyLogView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"

  easySQLView:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/easySQLView
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertopasca.QuickViewExtensions.easySQLView
        PRODUCT_NAME: easySQLView
        INFOPLIST_FILE: Extensions/easySQLView/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/easySQLView/easySQLView.entitlements
        ENABLE_APP_SANDBOX: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
