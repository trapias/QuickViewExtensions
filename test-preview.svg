<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="320" cy="60" r="40" fill="#FFD700" opacity="0.9" />

  <!-- Mountains -->
  <polygon points="0,200 100,100 200,200" fill="#78909C" />
  <polygon points="100,200 220,80 340,200" fill="#90A4AE" />
  <polygon points="250,200 350,120 400,200" fill="#78909C" />

  <!-- Grass -->
  <rect x="0" y="200" width="400" height="100" fill="url(#grassGrad)" />

  <!-- Tree -->
  <rect x="60" y="170" width="12" height="40" fill="#5D4037" rx="2" />
  <circle cx="66" cy="160" r="22" fill="#388E3C" />
  <circle cx="54" cy="168" r="16" fill="#43A047" />
  <circle cx="78" cy="168" r="16" fill="#43A047" />

  <!-- House -->
  <rect x="240" y="185" width="60" height="45" fill="#E57373" rx="2" />
  <polygon points="235,190 270,160 305,190" fill="#C62828" />
  <rect x="258" y="205" width="16" height="25" fill="#5D4037" />
  <rect x="280" y="198" width="12" height="12" fill="#BBDEFB" stroke="#90CAF9" />

  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="SF Pro, Helvetica, sans-serif" font-size="14" fill="#1B5E20" font-weight="600">
    easySVGView Test — QuickViewExtensions
  </text>
</svg>
